<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>事故复盘时间线</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>事故复盘时间线</h1>
  <div class="review-picker">
    <select id="review-select"></select>
    <button id="btn-new">新建复盘</button>
    <button id="btn-delete" class="danger">删除</button>
    <button id="btn-refresh" title="从服务器重新加载">刷新</button>
  </div>
</header>

<div id="banner" class="banner hidden"></div>

<main id="main" class="hidden">
  <section class="panel">
    <div class="review-head">
      <input id="review-title" type="text" placeholder="复盘标题">
      <span id="version-badge" class="badge"></span>
      <span id="status-badge" class="badge"></span>
      <button id="btn-versions">历史版本</button>
      <button id="btn-finalize">定稿</button>
      <button id="btn-save" class="primary">保存并重新推算</button>
    </div>

    <h2>事件</h2>
    <p class="hint">记录每个事件的起始时间范围与持续分钟数。缺少时间范围的事件将作为“暂存”保存，暂不参与推算。</p>
    <table id="events-table">
      <thead>
        <tr>
          <th>事件名称</th><th>最早开始</th><th>最晚开始</th><th>持续(分钟)</th><th>备注</th><th></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <button id="btn-add-event">+ 添加事件</button>

    <h2>“先于”关系</h2>
    <p class="hint">A 先于 B：A 必须在 B 开始前结束（A 开始 + A 持续 ≤ B 开始）。</p>
    <div class="relation-add">
      <select id="rel-pre"></select>
      <span>先于</span>
      <select id="rel-suc"></select>
      <button id="btn-add-relation">+ 添加关系</button>
    </div>
    <ul id="relations-list" class="relations"></ul>
  </section>

  <section class="panel" id="results">
    <h2>推算结果</h2>
    <div id="result-summary"></div>
    <div id="conflicts"></div>
    <div id="drafts"></div>
    <div id="skipped"></div>
    <div id="windows"></div>
  </section>
</main>

<div id="empty" class="empty">请选择或新建一个复盘开始协作。</div>

<div id="versions-panel" class="overlay hidden">
  <div class="overlay-box">
    <div class="overlay-head">
      <h2>历史版本</h2>
      <button id="btn-versions-close">✕ 关闭</button>
    </div>
    <p class="hint">每次保存与定稿都会留存不可变的输入快照与推算结果。恢复会把指定版本复制为新的草稿版本并重新推算，
      旧版本全部保留；缺少输入快照的旧版本明确标记为不可回看、不可恢复。</p>
    <div id="versions-list"></div>
  </div>
</div>

<div id="snapshot-view" class="overlay hidden">
  <div class="overlay-box">
    <div class="overlay-head">
      <h2 id="snapshot-title">回看版本</h2>
      <div class="overlay-actions">
        <button id="btn-snapshot-restore" class="primary">恢复此版本为新草稿</button>
        <button id="btn-snapshot-close">✕ 关闭</button>
      </div>
    </div>
    <div id="snapshot-body"></div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
